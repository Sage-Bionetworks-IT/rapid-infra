# A personal test environment in the DNT dev account (profile dnt-dev-admin), not RAPID's dev.
# Deployed from a laptop, never by CI:
#   cdk deploy --context env=sandbox --all --profile dnt-dev-admin
#   SYNAPSE_AUTH_TOKEN=... python tools/setup_synapse_projects.py --env sandbox
# Stacks: rapid-sandbox-bucket-test

# Deploys with credentials for any other account fail
AWS_ACCOUNT: "631692904429"

SYNAPSE:
  aws_account_id: "325565585839"
  # For a test, your own Synapse user works: tools/setup_synapse_projects.py creates the test
  # project with its PAT (SYNAPSE_AUTH_TOKEN), so it administers the project
  service_account_id: "3324230"  # the user whose PAT you use
  # Exercises the folder setup
  project_folders: [raw, processed/level_1]

BUCKETS:
  # id: short name, used in the stack name (rapid-dev-bucket-example). Lowercase, digits, dashes
  - id: test
    # Globally unique S3 bucket name
    bucket_name: rapid-dev-example-data  # TODO
    # The provider's Synapse project, created by the deploy (tools/setup_synapse_projects.py)
    # with the bucket as its only upload destination. Project names are global
    synapse_project_name: RAPID sandbox provider  # TODO
    # Optional, default "sts". The empty folder in the project that gives contributors
    # read-write STS credentials for the bucket (files are indexed at the project root)
    sts_folder: sts
    # Synapse user or team IDs written to owner.txt (the service account is added for you)
    synapse_owner_ids: [3627882]
    # Optional. IAM principals (ARNs) with read/write on the objects
    s3_user_arns: []
    # Optional. IAM principals (ARNs) with full access to the bucket
    s3_admin_arns: []
    # Optional. IAM principals (ARNs) denied every s3:*Delete* on the objects
    deny_delete_arns: []
    # Optional, default false
    versioned: false
