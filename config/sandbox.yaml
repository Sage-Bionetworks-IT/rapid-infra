# A personal test environment in the DNT dev account (profile dnt-dev-admin), not RAPID's dev.
# Deployed from a laptop, never by CI:
#   cdk deploy --context env=sandbox --all --profile dnt-dev-admin
# Stacks: rapid-sandbox-bucket-test

# Deploys with credentials for any other account fail
AWS_ACCOUNT: "631692904429"

SYNAPSE:
  aws_account_id: "325565585839"
  # For a test, your own Synapse user works: the sync logs in with its PAT, and it must
  # administer the test project
  service_account_id: "3324230"  # the user whose PAT is in the secret

BUCKETS:
  # id: short name, used in the stack name (rapid-dev-bucket-example). Lowercase, digits, dashes
  - id: test
    # Globally unique S3 bucket name
    bucket_name: rapid-dev-example-data  # TODO
    # The Synapse project files sync into
    synapse_project_id: syn78529741  # TODO
    # Synapse user or team IDs written to owner.txt (the service account is added for you)
    synapse_owner_ids: [3627882]
    # Optional. IAM principals (ARNs) with read/write on the objects
    s3_user_arns: []
    # Optional. IAM principals (ARNs) with full access to the bucket
    s3_admin_arns: []
    # Optional. IAM principals (ARNs) denied every s3:*Delete* on the objects
    deny_delete_arns: []
    # Optional, default false
    versioned: false
