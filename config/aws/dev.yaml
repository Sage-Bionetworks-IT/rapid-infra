SYNAPSE:
  # The Synapse user the sync will log in as. It is added to every bucket's owner.txt, since
  # it must create the storage locations, and each bucket stack outputs it for
  # tools/setup_synapse_projects.py, which must run as this user (SYNAPSE_AUTH_TOKEN secret).
  service_account_id: "3631461"  # rapid-dev-infra-service

BUCKETS:
  # id: short name, used in the stack name (rapid-dev-bucket-example). Lowercase, digits, dashes
  - id: example
    # Globally unique S3 bucket name
    bucket_name: rapid-dev-provider-a  # TODO
    # Synapse user or team IDs written to owner.txt (the service account is added for you)
    synapse_owner_ids: [3627882] # "RAPID Test" team
    # Optional. IAM principals (ARNs) with read/write on the objects
    s3_user_arns: []
    # Optional. IAM principals (ARNs) with full access to the bucket
    s3_admin_arns: []
    # Optional. IAM principals (ARNs) denied every s3:*Delete* on the objects
    deny_delete_arns: []
    # Optional, default false
    versioned: false
