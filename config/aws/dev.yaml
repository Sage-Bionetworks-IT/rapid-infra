SYNAPSE:
  # The Synapse user the sync Lambda logs in as (its PAT is in the pipeline stack's secret). It
  # is added to every bucket's owner.txt, since it must create the storage locations, and each
  # bucket stack outputs it for tools/setup_synapse_projects.py, which must run as this user
  # (its PAT is also the SYNAPSE_AUTH_TOKEN GitHub secret).
  service_account_id: "3631461"  # rapid-dev-infra-service

ALARM_EMAIL: "aws-rapid-dev@sagebase.org"

SYNC:
  sidecar_filename: sidecar.json
  max_concurrency: 5
  tolerated_failure_percentage: 0
  results_retention_days: 30

BUCKETS:
  # Globally unique S3 bucket name (lowercase, digits, dashes). Also names the stack
  # (rapid-dev-bucket-rapid-dev-provider-example) and is how config/synapse/dev.yaml refers to it
  - bucket_name: rapid-dev-provider-example
    # Synapse user or team IDs written to owner.txt (the service account is added for you)
    synapse_owner_ids: [3627882] # "RAPID Test" team
    # Optional. IAM principals (ARNs) with read/write on the objects; not needed with STS
    s3_user_arns: []
    # Optional. IAM principals (ARNs) with full access to the bucket
    s3_admin_arns: []
    # Optional. IAM principals (ARNs) denied every s3:*Delete* on the objects
    deny_delete_arns: []
    # Optional, default false
    versioned: false

# The graph's VPC (rapid-dev-network)
VPC_CIDR: 10.254.176.0/24

NEPTUNE:
  serverless_max_capacity: 4.0
  deletion_protection: false  # allow easier cleanup in dev
