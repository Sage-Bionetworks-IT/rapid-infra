# A personal test environment in the DNT dev account (profile dnt-dev-admin), not RAPID's dev.
# Deployed from a laptop, never by CI:
#   cdk deploy --context env=sandbox --all --profile dnt-dev-admin --outputs-file cdk-outputs.json
#   SYNAPSE_AUTH_TOKEN=... python tools/setup_synapse_projects.py \
#     --template config/synapse/sandbox.yaml --cdk-outputs cdk-outputs.json
# Stacks: rapid-sandbox-bucket-rapid-dev-example-data,
# rapid-sandbox-bucket-rapid-sandbox-kmstest-data, rapid-sandbox-pipeline

# Deploys with credentials for any other account fail
AWS_ACCOUNT: "631692904429"

SYNAPSE:
  aws_account_id: "325565585839"
  # For a test, your own Synapse user works: tools/setup_synapse_projects.py creates the test
  # project with its PAT (SYNAPSE_AUTH_TOKEN), so it administers the project
  service_account_id: "3324230"  # the user whose PAT you use

SYNC:
  sidecar_filename: sidecar.json
  max_concurrency: 5
  tolerated_failure_percentage: 0
  results_retention_days: 7

ALARM_EMAIL: ""

# Off: the DNT dev account already has a trail logging every S3 data event (test-s3-trail)
S3_DATA_EVENTS:
  enabled: false

BUCKETS:
  # Globally unique S3 bucket name
  - bucket_name: rapid-dev-example-data
    # Synapse user or team IDs written to owner.txt (the service account is added for you)
    synapse_owner_ids: [3627882]
    # Optional. IAM principals (ARNs) with read/write on the objects
    s3_user_arns: []
    # Optional. IAM principals (ARNs) with full access to the bucket
    s3_admin_arns: []
    # Optional. IAM principals (ARNs) denied every s3:*Delete* on the objects
    deny_delete_arns: []
    # Optional, default false
    versioned: false

  # SSE-KMS trial (README: "SSE-KMS"): its own bucket and project, so the bucket above keeps
  # working for contribution tests. Expect STS uploads (contribute.py) to get AccessDenied
  - bucket_name: rapid-sandbox-kmstest-data
    synapse_owner_ids: [3627882]
    kms_encryption: true

  # Client-side encryption trial (README: "Client-side encryption"): its own bucket and
  # project ("RAPID CSE Test" in config/synapse/sandbox.yaml). Uncomment both to try it
  # - bucket_name: rapid-sandbox-csetest-data
  #   synapse_owner_ids: [3627882]
  #   client_side_encryption:
  #     encrypted_bucket_name: rapid-sandbox-csetest-encrypted
  #     patterns: ["**/*.vcf", "**/*.ndjson"]
  #     decrypt_arns: []
