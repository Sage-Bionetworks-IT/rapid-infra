# Loaded for every environment, then deep-merged with config/{env}.yaml: env wins, nested
# mappings merge key by key (an env file only lists the keys it changes), lists are replaced.

# Stack names are {PROJECT_NAME}-{env}-pipeline and {PROJECT_NAME}-{env}-bucket-{id}
PROJECT_NAME: rapid

TAGS:
  CostCenter: RAPID - ARPA-H - BP01 / 126500

# Extra tags for the provider buckets only (the stores of contributed data), e.g. the data
# classification Vanta reads. S3 tag values allow letters, digits, spaces and + - = . _ : / @
DATA_STORE_TAGS:
  VantaContainsUserData: "true"
  VantaUserDataStored: Data provider contributions that can contain controlled access data

SYNAPSE:
  # Synapse's AWS account; it reads/writes the bucket for Synapse uploads and downloads.
  # https://help.synapse.org/docs/Custom-Storage-Locations.2048327803.html
  aws_account_id: "325565585839"
  # The Synapse user the sync Lambda logs in as (its PAT is in the pipeline stack's secret).
  # It is added to every bucket's owner.txt, since it must create the storage locations. Its
  # PAT is also the SYNAPSE_AUTH_TOKEN GitHub secret, with which deploys set up each bucket's
  # Synapse project (tools/setup_synapse_projects.py).
  service_account_id: "0000000"  # TODO: set the service account's Synapse user ID
  # Folders created in every provider project, as paths ("a/b" nests b in a); existing ones
  # are kept. TODO: RAPID's folder structure, then the rest of the project setup
  # (tools/setup_synapse_projects.py: apply_project_template)
  project_folders: []

SYNC:
  # The completion sentinel: uploading {folder}/sidecar.json syncs everything under {folder}/
  sidecar_filename: sidecar.json
  # Per-file sync Lambdas running at once for one sidecar (Synapse API rate is the limit)
  max_concurrency: 10
  # Percentage of a folder's files allowed to fail before the execution fails (0: any failure)
  tolerated_failure_percentage: 0
  # Days the per-run result files are kept in the results bucket
  results_retention_days: 90

# Alarm emails (failed sync executions, the sidecar DLQ, Lambda errors). Confirm the SNS
# subscription once. Empty: no email.
ALARM_EMAIL: ""

# An Errors alarm on every Lambda function the app deploys, emailing ALARM_EMAIL (Vanta:
# "Serverless function error rate monitored (AWS)"). Fires at this many errors in 5 minutes
LAMBDA_ERROR_ALARMS:
  errors_per_5_minutes: 1

# Synapse-connected buckets. One stack per entry; see config/dev.yaml for the fields.
BUCKETS: []
