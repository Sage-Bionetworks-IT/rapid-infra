name: deploy-dev

on:
  push:
    branches: ['dev']

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      environment: dev
  aws-deploy:
    needs: test
    uses: ./.github/workflows/aws-deploy.yaml
    with:
      # TODO: the dev account's GitHub OIDC deploy role (Sage IT creates it)
      role-to-assume: "arn:aws:iam::000000000000:role/sagebase-github-oidc-sage-bionetworks-rapid-infra"
      role-session-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
      environment: dev
