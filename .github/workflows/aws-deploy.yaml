# Reusable: deploy every stack of one environment to its AWS account, then set up each
# bucket's Synapse project
name: aws-deploy

on:
  workflow_call:
    inputs:
      aws-region:
        type: string
        default: us-east-1
      role-to-assume:
        required: true
        type: string
      role-session-name:
        required: true
        type: string
      role-duration-seconds:
        type: number
        default: 3600
      environment:
        required: true
        type: string

# One deploy per environment at a time
concurrency:
  group: ${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # In the GitHub environment for its SYNAPSE_AUTH_TOKEN secret (the callers' secrets: inherit
    # makes it visible here). The OIDC subject becomes repo:<org>/<repo>:environment:<env>, which
    # the AWS role trusts (Sage IT's github-oidc-provider template trusts environment:*).
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
      - run: npm install -g aws-cdk
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}
          role-session-name: ${{ inputs.role-session-name }}
          role-duration-seconds: ${{ inputs.role-duration-seconds }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # The outputs (every stack's, changed or not) are the Synapse setup's input
      - run: >-
          cdk deploy --context env=${{ inputs.environment }} --all --concurrency 5
          --require-approval never --outputs-file cdk-outputs.json
      # The sync Lambdas' PAT: the environment's SYNAPSE_AUTH_TOKEN, so rotating it is "update
      # the GitHub secret, redeploy". Put only when it changed, so a deploy adds no version.
      - name: Set the pipeline's Synapse PAT
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
        run: |
          arn=$(jq -r '[.[].SynapsePatSecretArn // empty][0] // empty' cdk-outputs.json)
          if [ -z "$arn" ]; then
            echo "No pipeline stack (no buckets), so no PAT secret to set"
            exit 0
          fi
          if [ -z "$SYNAPSE_AUTH_TOKEN" ]; then
            echo "::error::Set the ${{ inputs.environment }} environment's SYNAPSE_AUTH_TOKEN"
            exit 1
          fi
          current=$(aws secretsmanager get-secret-value --secret-id "$arn" \
            --query SecretString --output text)
          if [ "$current" != "$SYNAPSE_AUTH_TOKEN" ]; then
            aws secretsmanager put-secret-value --secret-id "$arn" \
              --secret-string "$SYNAPSE_AUTH_TOKEN" > /dev/null
            echo "Updated $arn"
          else
            echo "$arn is up to date"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: cdk-outputs.json

  # The Synapse template's projects, on the buckets the deploy just output (so every bucket and
  # its owner.txt exist). Idempotent, so it runs every time (a failed run is fixed by "Re-run
  # failed jobs"). No AWS credentials: it reads the deploy's outputs and only calls Synapse.
  synapse-setup:
    needs: deploy
    runs-on: ubuntu-latest
    # Runs in the GitHub environment for its SYNAPSE_AUTH_TOKEN secret (the PAT of
    # SYNAPSE.service_account_id); the callers' secrets: inherit makes it visible here.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: cdk-outputs
      - run: pip install -r tools/requirements.txt
      - run: >-
          python tools/setup_synapse_projects.py
          --template config/synapse/${{ inputs.environment }}.yaml
          --cdk-outputs cdk-outputs.json
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
