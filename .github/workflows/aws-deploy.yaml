# Reusable: deploy every stack of one environment to its AWS account, then set up each
# bucket's Synapse project
name: aws-deploy

on:
  workflow_call:
    inputs:
      aws-region:
        type: string
        default: us-east-1
      role-to-assume:
        required: true
        type: string
      role-session-name:
        required: true
        type: string
      role-duration-seconds:
        type: number
        default: 3600
      environment:
        required: true
        type: string
    secrets:
      # The Synapse service account's PAT (SYNAPSE.service_account_id)
      SYNAPSE_AUTH_TOKEN:
        required: true

# One deploy per environment at a time
concurrency:
  group: ${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
      - run: npm install -g aws-cdk
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}
          role-session-name: ${{ inputs.role-session-name }}
          role-duration-seconds: ${{ inputs.role-duration-seconds }}
      - run: cdk deploy --context env=${{ inputs.environment }} --all --concurrency 5 --require-approval never

  # After the deploy, so every bucket and its owner.txt exist. Idempotent, so it runs every time
  # (a failed run is fixed by "Re-run failed jobs"). No AWS credentials: it only calls Synapse.
  synapse-setup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r tools/requirements.txt
      - run: python tools/setup_synapse_projects.py --env ${{ inputs.environment }}
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
