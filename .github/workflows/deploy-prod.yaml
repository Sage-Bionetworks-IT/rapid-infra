name: deploy-prod

on:
  push:
    branches: ['prod']

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      environment: prod
  aws-deploy:
    needs: test
    uses: ./.github/workflows/aws-deploy.yaml
    with:
      role-to-assume: "arn:aws:iam::565839248283:role/sagebase-github-oidc-sage-bionetworks-rapid-prod-infra"
      role-session-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
      environment: prod
