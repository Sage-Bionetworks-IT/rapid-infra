name: test

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # The CDK CLI fails on an app without stacks; running the app still loads and validates the
      # environment's config. `cdk synth` replaces this with the first stack.
      - run: python app.py
        env:
          CDK_CONTEXT_JSON: '{"env": "${{ inputs.environment }}"}'
